kind = "mobile"
previewPath = "/"
title = "Mobile App Generator"
description = "A focused dark-mode mobile workspace for turning natural-language prompts into app concepts and generated code, with voice input support and a clear output area."
version = "1.0.0"
id = "artifacts/mobile-app-generator"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18545

[services.development]
run = "pnpm --filter @workspace/mobile-app-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile-app-generator", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile-app-generator", "run", "serve" ]

[services.env]
PORT = "18545"
BASE_PATH = "/"
